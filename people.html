<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>2DWORLD - People</title>
  <style>
    /* --- INTEGRATED 2DWORLD STYLESHEET CONFIGURATION --- */
    :root {
      --scale: 1.30;
      --pageW: 900px;
      --navBlue1: #1b67c9;
      --navBlue2: #0e4ea4;
      --sky1: #1f84e8;
      --sky2: #0e4ea4;
      --boxBorder: #b9b9b9;
      --boxShadow: rgba(0,0,0,.25);
      --text: #222;
      --link: #1a4fb0;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      font: 12px/1.2 Tahoma, Arial, sans-serif;
      color: var(--text);
      background:
        radial-gradient(900px 500px at 50% 0%, rgba(255,255,255,.35), rgba(255,255,255,0) 60%),
        linear-gradient(#0a3f9b, #042765);
    }
    a { color: var(--link); text-decoration: none; }
    a:hover { text-decoration: underline; }
    
    #viewport { width: 100%; display: flex; justify-content: center; padding: 14px 0 40px; }
    #page { width: var(--pageW); transform: scale(var(--scale)); transform-origin: top center; }
    
    .top-sky {
      background:
        radial-gradient(600px 220px at 50% 35%, rgba(255,255,255,.35), rgba(255,255,255,0) 65%),
        linear-gradient(var(--sky1), var(--sky2));
      border: 1px solid rgba(255,255,255,.25);
      box-shadow: 0 6px 16px rgba(0,0,0,.28);
    }
    .nav {
      list-style: none; margin: 0; padding: 0 6px; display: flex; gap: 2px;
      background: linear-gradient(var(--navBlue1), var(--navBlue2));
      border-top: 1px solid rgba(255,255,255,.22);
      border-bottom: 1px solid rgba(0,0,0,.35);
      flex-wrap: wrap;
    }
    .nav a {
      display: block; padding: 7px 10px; color: #fff; font-weight: bold;
      text-shadow: 0 1px 0 rgba(0,0,0,.35);
    }
    
    .box { background: #fff; border: 1px solid var(--boxBorder); box-shadow: 2px 2px 0 var(--boxShadow); margin-bottom: 12px; }
    .box-h { padding: 6px 8px; font-weight: bold; background: linear-gradient(#ededed, #d8d8d8); border-bottom: 1px solid #bdbdbd; }
    .box-h.dark { color: #fff; background: linear-gradient(#3b3b3b,#1f1f1f); border-bottom: 1px solid #000; }
    .box-b { padding: 8px; }
    
    .txt { width: 100%; padding: 4px; border: 1px solid #999; background: #fff; font: 12px Tahoma, Arial, sans-serif; }
    .btn {
      display: inline-block; padding: 6px 10px; font-weight: bold;
      border-radius: 2px; border: 1px solid rgba(0,0,0,.55);
      box-shadow: inset 0 1px 0 rgba(255,255,255,.25);
      cursor: pointer; background: linear-gradient(#79c7ff,#2b7bd4); color: #fff;
    }
    .notice { padding: 8px; border: 1px solid #aaa; background: linear-gradient(#fff,#f2f2f2); margin-bottom: 10px; }
    .notice.good { border-color: #4cae4c; }
    .notice.bad { border-color: #c94b4b; color: #a94442; }
    
    .avatarPick {
      width: 96px; height: 96px; border: 1px solid #666;
      box-shadow: 2px 2px 0 rgba(0,0,0,.25); background: linear-gradient(#fff,#e9e9e9);
      display: flex; align-items: center; justify-content: center; border-radius: 4px;
    }
    .avatarPick.selected { outline: 3px solid rgba(43,123,212,.9); outline-offset: 2px; }
    
    .userCard {
      display: flex; gap: 12px; padding: 10px;
      border: 1px solid #bbb; background: linear-gradient(#fff,#f2f2f2);
      box-shadow: 2px 2px 0 rgba(0,0,0,.18); margin-top: 10px;
    }
    .userMeta .name { font-weight: bold; font-size: 14px; color: var(--link); }
    .userMeta .sub { font-size: 11px; color: #555; margin-top: 4px; }
    .searchRow { display: flex; gap: 8px; align-items: center; }
    .searchRow input[type="text"] { flex: 1; }
    
    .status-badge {
      display: inline-block; padding: 3px 8px; border-radius: 3px;
      font-size: 10px; font-weight: bold; color: #fff; text-shadow: 0 1px 0 rgba(0,0,0,0.2);
    }
    .status-badge.online { background: #2baf2b; border: 1px solid #1e841e; }
    .status-badge.offline { background: #777777; border: 1px solid #555555; }
  </style>
</head>
<body>

<div id="viewport">
  <div id="page">
    
    <!-- Top Nav Sky Graphic Block Layout -->
    <div class="top-sky">
      <ul class="nav">
        <li><a href="index.html">My 2DWORLD</a></li>
        <li><a href="worlds.html">Worlds</a></li>
        <li><a href="catalog.html">Catalog</a></li>
        <li><a href="people.html" style="background: rgba(0,0,0,0.25);">People</a></li>
        <li><a href="creatorclub.html">Creator Club</a></li>
        <li><a href="events.html">Events</a></li>
        <li><a href="forum.html">Forum</a></li>
        <li><a href="news.html">News</a></li>
        <li><a href="parents.html">Parents</a></li>
        <li><a href="help.html">Help</a></li>
      </ul>
    </div>

    <div style="margin-top: 14px;">
      <!-- Search Input Section Panel -->
      <div class="box">
        <div class="box-h dark">Search Users</div>
        <div class="box-b">
          <div class="searchRow">
            <input type="text" id="userInput" class="txt" placeholder="Enter username (e.g. admin)...">
            <button id="searchBtn" class="btn">Search</button>
          </div>
        </div>
      </div>

      <!-- Live Engine Feed Output Box -->
      <div class="box">
        <div class="box-h">Directory Results</div>
        <div class="box-b">
          <div id="statusNotice" class="notice bad" style="display: none;"></div>
          <div id="resultsView">
            <span style="color:#666; font-style:italic;">Type a player name above to query the database.</span>
          </div>
        </div>
      </div>
    </div>

  </div>
</div>

<!-- FIXED: Explicit CDN URLs matching Firebase version 10.14.1 -->
<script type="module">
  import { initializeApp } from "gstatic.com";
  import { getFirestore, doc, getDoc } from "gstatic.com";

  // Configuration for project dworld-b10ea
  const firebaseConfig = {
    apiKey: "AIzaSyAsX-YOUR_ACTUAL_WEB_API_KEY_HERE", 
    authDomain: "firebaseapp.com",
    projectId: "dworld-b10ea",
    storageBucket: "appspot.com",
    messagingSenderId: "YOUR_MESSAGING_SENDER_ID",
    appId: "YOUR_APP_ID_STRING"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);

  const searchBtn = document.getElementById('searchBtn');
  const userInput = document.getElementById('userInput');
  const resultsView = document.getElementById('resultsView');
  const statusNotice = document.getElementById('statusNotice');

  searchBtn.addEventListener('click', async () => {
    const queryName = userInput.value.trim().toLowerCase();
    statusNotice.style.display = 'none';
    resultsView.innerHTML = "";

    if (!queryName) {
      statusNotice.textContent = "Please provide a character name.";
      statusNotice.style.display = 'block';
      return;
    }

    resultsView.innerHTML = "<span style='color:#666;'>Accessing 2DWORLD directories...</span>";

    try {
      const userDocRef = doc(db, "usernames", queryName);
      const userSnapshot = await getDoc(userDocRef);

      resultsView.innerHTML = "";

      if (!userSnapshot.exists()) {
        statusNotice.textContent = `The player record "${userInput.value.trim()}" could not be located.`;
        statusNotice.style.display = 'block';
        return;
      }

      const data = userSnapshot.data();
      
      const isOnline = data.status && data.status.toLowerCase() === "online";
      const badgeClass = isOnline ? "online" : "offline";
      const badgeLabel = isOnline ? "ONLINE" : "OFFLINE";
      const displayTitle = queryName.charAt(0).toUpperCase() + queryName.slice(1);

      resultsView.innerHTML = `
        <div class="userCard">
          <div class="avatarPick selected" id="renderCanvas_${data.uid || queryName}">
            <span style="font-size: 28px;">👤</span>
          </div>
          <div class="userMeta" style="flex:1;">
            <div class="name">${displayTitle}</div>
            <div class="sub"><strong>Joined:</strong> ${data.joinDate || 'Unknown'}</div>
            <div class="sub" style="margin-top:6px; line-height:1.4; color:#333;">
              <strong>About:</strong> ${data.bio || 'This user has not written a biography yet.'}
            </div>
          </div>
          <div style="text-align: right;">
            <span class="status-badge ${badgeClass}">${badgeLabel}</span>
          </div>
        </div>
      `;

    } catch (err) {
      console.error("Firestore System Error:", err);
      statusNotice.textContent = "Database communication failure. Review your Firebase config or API keys.";
      statusNotice.style.display = 'block';
      resultsView.innerHTML = "";
    }
  });
</script>

</body>
</html>
